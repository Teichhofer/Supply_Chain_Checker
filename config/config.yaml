# Beispielkonfiguration für Supply Chain Checker (V1)
# Nutzung:
#   cp config/config.example.yaml config/config.yaml
#   export OPENAI_API_KEY="<dein_api_key>"

paths:
  # Eingangsordner für neue PDFs
  input_dir: data/input
  # Ausgabeverzeichnis für CSV-Artefakte je Lauf
  output_dir: data/output
  # Statusdateien (z. B. processed_files.json)
  state_dir: data/state
  # Logdateien je Lauf
  logs_dir: logs

logging:
  # DEBUG | INFO | WARNING | ERROR
  level: INFO
  file_name: supply_chain_checker.log

llm:
  # V1 unterstützt OpenAI als Provider
  provider: openai
  model: gpt-4.1-mini
  extraction_model: gpt-5.4-nano
  assessment_model: gpt-5.4
  timeout_seconds: 30
  max_retries: 2
  temperature: 0.0

prompts:
  extraction: |
    Extrahiere alle im Dokument genannten Produkte aus "{document_name}".
    Gib maximal {max_products_per_document} Produkte zurück.
    Nutze den folgenden Dokumenttext:
    {document_text}
    Antworte ausschließlich als JSON-Liste von Objekten.
  assessment: |
    Bewerte das Lieferkettenrisiko für das Produkt "{product_name}" für den Fall einer schweren Eskalation des China-Taiwan-Konflikts zu einem militärischen Konflikt unter Einbeziehung der USA.
    Berücksichtige entlang der gesamten Lieferkette: Komponenten, Halbzeuge, Vorprodukte, Rohstoffe, Logistik, Energie und kritische Zulieferabhängigkeiten.
    Gehe von einem Stressszenario aus (Sanktionen/Exportkontrollen, gestörte See- und Luftfracht, Engpässe bei Vorprodukten) und nicht von einem milden Basisszenario.
    Gib preisänderung_prozent als plausible mittlere Beschaffungspreisänderung in den ersten 12 Monaten gegenüber dem Vorkrisenniveau an (in Prozentpunkten, also 35 statt 0.35).
    Kalibriere die Zahl auf ein Kriegsszenario und bewerte explizit Erst- und Zweitrundeneffekte (Inputkosten, Energie, Logistik, Versicherungen, Umroutung, Requalifizierung).
    Nutze diese Orientierung als Plausibilitätsanker und begründe Abweichungen kurz:
    - lokal/regional und gut substituierbar: häufig ca. 10-25 %
    - global gehandelte Standardgüter mit Energie-/Logistikhebel: häufig ca. 20-45 %
    - elektronik- oder asienabhängige Güter mit hoher Konzentration: häufig ca. 35-80 %
    - bei schwer substituierbaren Engpasskomponenten sind temporär >80 % möglich
    Falls die Bandbreite groß ist, wähle einen realistischen Mittelpunkt der erwarteten Spannweite und vermeide konservatives "Mittelwert-Bias" in diesem Stressszenario.
    Antworte als JSON mit risikostufe, preisänderung_prozent und begründung.

parameters:
  # OCR nur nutzen, wenn direkte PDF-Textextraktion nicht ausreicht
  use_ocr_fallback: true
  # Sicherheitsgrenze pro Dokument
  max_products_per_document: 100
  # Maximale Wortzahl für die Begründung im Assessment
  max_assessment_reason_words: 100
  # Verhalten bei defekter Statusdatei: abort | reset
  on_corrupt_status_file: abort
