paths:
  input_dir: data/input
  output_dir: data/output
  state_dir: data/state
  logs_dir: logs

logging:
  level: INFO
  file_name: supply_chain_checker.log

llm:
  provider: openai
  model: gpt-4.1-mini
  timeout_seconds: 30
  max_retries: 2
  temperature: 0.0

prompts:
  extraction: |
    Extrahiere alle im Dokument genannten Produkte.
    Antworte als JSON-Liste mit den verfügbaren Produktfeldern.
  assessment: |
    Bewerte das Lieferkettenrisiko für das Produkt "{product_name}".
    Antworte als JSON mit risikostufe, preisänderung_prozent und begründung.

parameters:
  use_ocr_fallback: true
  max_products_per_document: 100
  max_assessment_reason_words: 100
  on_corrupt_status_file: abort
