[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-checker"
version = "0.1.0"
description = "CLI tool to extract and assess product supply-chain risks from PDFs"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Supply Chain Checker Team" }
]
dependencies = [
  "pyyaml>=6.0",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
]

[project.scripts]
supply-chain-checker = "supply_chain_checker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
packages = ["supply_chain_checker"]
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
# Keep default pytest execution independent from optional plugins like pytest-cov.
# Coverage flags can still be provided in CI or locally via PYTEST_ADDOPTS.
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
