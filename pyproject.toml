[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-checker"
version = "0.1.0"
description = "CLI tool to extract and assess product supply-chain risks from PDFs"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Supply Chain Checker Team" }
]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
]

[project.scripts]
supply-chain-checker = "supply_chain_checker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
